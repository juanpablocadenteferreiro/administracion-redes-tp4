# Drop-in para docker.service  ->  /etc/systemd/system/docker.service.d/10-tp2-wg0.conf
#
# Los contenedores publican sus puertos en la IP de wg0 (ej. 10.8.0.1). Si Docker arrancara
# antes que la interfaz, el bind fallaria ("cannot assign requested address").
# Con esto Docker espera a que wg-quick@wg0 haya levantado el tunel.
[Unit]
Requires=wg-quick@wg0.service
After=wg-quick@wg0.service
