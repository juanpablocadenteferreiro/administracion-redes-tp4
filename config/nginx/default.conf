# TP2 - nginx (contenedor nginx-unprivileged, escucha en 8080 -> publicado en VPN_IP:80)
#
# /~usuario/...          -> /home/usuario/public_html/...   (el /home del host esta montado :ro)
# /~usuario/privado/...  -> igual, pero con autenticacion HTTP basica (bonus)
# /                      -> pagina principal con enlaces a los usuarios (la genera genindex.sh)

server {
    listen 8080 default_server;
    server_name _;

    server_tokens off;
    absolute_redirect off;               # redirecciones relativas (el puerto interno es 8080, el externo 80)
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Sitio de solo lectura
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Nunca servir archivos ocultos (.ssh, .git, .bash_history, ...)
    location ~ /\. {
        deny all;
        return 404;
    }

    # --- BONUS: directorio protegido con usuario/contrasena -------------------
    # Debe ir ANTES del location generico: nginx usa el primer regex que coincide.
    location ~ ^/~(?<usr>[a-z_][a-z0-9_-]*)/privado(?<rest>/.*)?$ {
        auth_basic           "Zona privada - Pantera";
        auth_basic_user_file /etc/nginx/htpasswd;
        alias                /home/$usr/public_html/privado$rest;
        index                index.html;
        autoindex            off;
    }

    # --- Directorios de usuario: /~usuario/ -----------------------------------
    # El nombre de usuario se valida con una regex estricta (sin puntos ni barras),
    # asi no hay forma de escapar de /home/<usuario>/public_html con "..".
    # Los permisos son los del sistema operativo: el proceso nginx (uid 101) solo puede
    # leer lo que "otros" pueden leer en el host (home 711 + public_html 755).
    location ~ ^/~(?<usr>[a-z_][a-z0-9_-]*)(?<rest>/.*)?$ {
        alias     /home/$usr/public_html$rest;
        index     index.html index.htm;
        autoindex on;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
