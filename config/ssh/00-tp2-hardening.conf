# TP2 - Hardening de SSH
# El nombre empieza con "00-" a proposito: sshd usa el PRIMER valor que lee de cada opcion
# y en Ubuntu/cloud-init existe 50-cloud-init.conf con "PasswordAuthentication yes".
# Asi este archivo gana.

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:30

X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no

ClientAliveInterval 300
ClientAliveCountMax 2
